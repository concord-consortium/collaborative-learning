name: CI Firmware
# Rebuilds the Spiker:bit firmware hex, and the user guide sections and images generated from
# the firmware source, with the pinned MakeCode toolchain. It fails when any of them differs
# from what is committed, i.e. when spikerbit-clue.ts changed but they weren't rebuilt. See src/plugins/dataflow/firmware/README.md.

# pull_request, not push, for branches: its path filter compares the whole PR with its base
# branch, so every new head of a PR that touches the firmware gets the check. A push filter
# only looks at what that one push changed, so a later unrelated push would leave the PR's head
# without it. The push to master catches two PRs that each passed but leave a stale hex once
# both are merged, e.g. one rebuilt from new source with the old toolchain pins.
on:
  pull_request:
    paths:
      - 'src/plugins/dataflow/firmware/**'
      - 'scripts/spikerbit-firmware/**'
      - '.github/workflows/firmware.yml'
  push:
    branches: [master]
    paths:
      - 'src/plugins/dataflow/firmware/**'
      - 'scripts/spikerbit-firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  firmware:
    name: Check Spiker:bit firmware hex and guide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The job runs third-party install scripts, so don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/spikerbit-firmware/package-lock.json
      - name: Install MakeCode toolchain
        working-directory: ./scripts/spikerbit-firmware
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000
      - name: Rebuild and compare
        working-directory: ./scripts/spikerbit-firmware
        run: npm run check
      - name: Check that a stale hex fails
        working-directory: ./scripts/spikerbit-firmware
        run: |
          echo "// stale" >> ../../src/plugins/dataflow/firmware/spikerbit-clue.ts
          if npm run check; then echo "check passed with a stale source" >&2; exit 1; fi
      - name: Check that a hand-edited guide fails
        working-directory: ./scripts/spikerbit-firmware
        run: |
          # Undo the previous step's edit so that it can't be what fails this check.
          git checkout -- ../../src/plugins/dataflow/firmware/spikerbit-clue.ts
          # Append to the last line of the generated values section, a table row.
          node -e '
            const fs = require("fs");
            const file = "../../src/plugins/dataflow/firmware/user-guide.md";
            const lines = fs.readFileSync(file, "utf8").split("\n");
            const end = lines.indexOf("<!-- end generated: values -->");
            lines[end - 1] += "x";
            fs.writeFileSync(file, lines.join("\n"));
          '
          if npm run check; then echo "check passed with a hand-edited guide" >&2; exit 1; fi
