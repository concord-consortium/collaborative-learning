name: CI Firmware
# Rebuilds the Spiker:bit firmware hex with the pinned MakeCode toolchain and fails when it
# differs from the committed spikerbit-clue.hex, i.e. when spikerbit-clue.ts changed but the
# hex wasn't rebuilt. See src/plugins/dataflow/firmware/README.md.

# pull_request, not push: its path filter compares the whole PR with its base branch, so every
# new head of a PR that touches the firmware gets the check. A push filter only looks at what
# that one push changed, so a later unrelated push would leave the PR's head without it.
on:
  pull_request:
    paths:
      - 'src/plugins/dataflow/firmware/**'
      - 'scripts/spikerbit-firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  firmware:
    name: Check Spiker:bit firmware hex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The job runs third-party install scripts, so don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/spikerbit-firmware/package-lock.json
      - name: Install MakeCode toolchain
        working-directory: ./scripts/spikerbit-firmware
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000
      - name: Rebuild and compare
        working-directory: ./scripts/spikerbit-firmware
        run: npm run check
      - name: Check that a stale hex fails
        working-directory: ./scripts/spikerbit-firmware
        run: |
          echo "// stale" >> ../../src/plugins/dataflow/firmware/spikerbit-clue.ts
          if npm run check; then echo "check passed with a stale source" >&2; exit 1; fi
