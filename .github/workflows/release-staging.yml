name: Release Staging
on:
  workflow_dispatch:
    inputs:
      version:
        description: The git tag for the version to use for staging.html
        required: true
jobs:
  release:
    # These permissions are passed through to the called workflow, which cannot have
    # more than its caller. `id-token: write` is never granted by default.
    permissions:
      id-token: write
      contents: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      dest-file: staging.html
      environment: staging
      url: https://collaborative-learning.concord.org/staging.html
    secrets: inherit
